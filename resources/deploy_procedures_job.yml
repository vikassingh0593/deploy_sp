resources:
  jobs:
    deploy_stored_procedures:
      name: "[${bundle.target}] Deploy SQL Stored Procedures"
      tasks:
        - task_key: deploy_sp_calculate_metrics
          sql_task:
            file:
              path: ../sql/01_sp_calculate_metrics.sql
            warehouse_id: ${var.sql_warehouse_id}

        - task_key: deploy_sp_clean_staging
          sql_task:
            file:
              path: ../sql/02_sp_clean_staging.sql
            warehouse_id: ${var.sql_warehouse_id}

        - task_key: deploy_sp_run_simulation
          sql_task:
            file:
              path: ../sql/03_sp_run_simulation.sql
            warehouse_id: ${var.sql_warehouse_id}
